<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />

  {/* UI Window Frame */}
  <rect x="40" y="40" width="720" height="420" rx="16" fill="#111827" stroke="#312e81" stroke-width="2" />
  <path d="M 40 56 C 40 47, 47 40, 56 40 L 744 40 C 753 40, 760 47, 760 56 L 760 85 L 40 85 Z" fill="#0f172a" />
  <circle cx="70" cy="62" r="6" fill="#ef4444" />
  <circle cx="90" cy="62" r="6" fill="#f59e0b" />
  <circle cx="110" cy="62" r="6" fill="#10b981" />
  <text x="400" y="67" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">Digital Library Management System</text>

  {/* Search Bar */}
  <rect x="70" y="105" width="660" height="44" rx="12" fill="#0b0f19" stroke="#312e81" stroke-width="1.5" />
  <text x="100" y="132" font-family="sans-serif" font-size="13" fill="#64748b">🔍 Search books by title, author, ISBN, or subject category...</text>

  {/* Book Grid Cards */}
  <g transform="translate(70, 170)">
    {/* Book 1 */}
    <rect x="0" y="0" width="150" height="260" rx="12" fill="#1e293b" stroke="#312e81" stroke-width="1" />
    <rect x="15" y="15" width="120" height="150" rx="8" fill="#4f46e5" />
    <text x="75" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Software Arch</text>
    <text x="15" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Clean Code</text>
    <text x="15" y="215" font-family="sans-serif" font-size="10" fill="#94a3b8">Available • 12 Copies</text>
    <rect x="15" y="225" width="120" height="22" rx="6" fill="#10b981" />
    <text x="75" y="240" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Borrow Book</text>
  </g>

  <g transform="translate(240, 170)">
    {/* Book 2 */}
    <rect x="0" y="0" width="150" height="260" rx="12" fill="#1e293b" stroke="#312e81" stroke-width="1" />
    <rect x="15" y="15" width="120" height="150" rx="8" fill="#0284c7" />
    <text x="75" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Algorithms</text>
    <text x="15" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Data Structures</text>
    <text x="15" y="215" font-family="sans-serif" font-size="10" fill="#94a3b8">Borrowed • Due Aug 20</text>
    <rect x="15" y="225" width="120" height="22" rx="6" fill="#f59e0b" />
    <text x="75" y="240" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Reserved</text>
  </g>

  <g transform="translate(410, 170)">
    {/* Book 3 */}
    <rect x="0" y="0" width="150" height="260" rx="12" fill="#1e293b" stroke="#312e81" stroke-width="1" />
    <rect x="15" y="15" width="120" height="150" rx="8" fill="#7c3aed" />
    <text x="75" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Database Sys</text>
    <text x="15" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">SQL Mastery</text>
    <text x="15" y="215" font-family="sans-serif" font-size="10" fill="#94a3b8">Available • 8 Copies</text>
    <rect x="15" y="225" width="120" height="22" rx="6" fill="#10b981" />
    <text x="75" y="240" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Borrow Book</text>
  </g>

  <g transform="translate(580, 170)">
    {/* Book 4 */}
    <rect x="0" y="0" width="150" height="260" rx="12" fill="#1e293b" stroke="#312e81" stroke-width="1" />
    <rect x="15" y="15" width="120" height="150" rx="8" fill="#059669" />
    <text x="75" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Web Systems</text>
    <text x="15" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Next.js &amp; Node</text>
    <text x="15" y="215" font-family="sans-serif" font-size="10" fill="#94a3b8">Available • 15 Copies</text>
    <rect x="15" y="225" width="120" height="22" rx="6" fill="#10b981" />
    <text x="75" y="240" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Borrow Book</text>
  </g>
</svg>
